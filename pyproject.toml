[build-system]
requires=["hatchling>=1.25"]
build-backend="hatchling.build"
[project]
name="industrial-reliability-copilot"
version="1.0.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3","pydantic-settings>=2.4,<3","scikit-learn>=1.5,<2","pandas>=2.2,<3","numpy>=1.26,<3","joblib>=1.4,<2","langgraph>=0.2,<2","mcp>=1,<2","structlog>=24,<26","opentelemetry-api>=1.28,<2"]
[project.optional-dependencies]
dev=["pytest>=8.3,<9","httpx>=0.27,<1","ruff>=0.7,<1","mypy>=1.11,<2"]
llm=["langchain-openai>=0.2,<2"]
[project.scripts]
reliability="reliability.cli:main"
reliability-mcp="reliability.mcp_server:main"
[tool.hatch.build.targets.wheel]
packages=["src/reliability"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
[tool.ruff]
line-length=100
target-version="py311"
